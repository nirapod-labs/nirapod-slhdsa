#
# Keep the pinned GitHub Actions used by CI up to date: one pull request a
# week for all of them, for releases at least a week old.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
