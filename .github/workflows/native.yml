#
# .github/workflows/native.yml
# ============================
#
# The checks of one platform, natively on a hosted runner of that platform,
# in one job: called by ci.yml once per platform that has checks to run in
# its plan (ci/plan.py). One job per platform keeps a run to one
# macOS runner, the scarce one, and takes the toolchain once.
#
# The toolchain comes from the toolchain job of the run (linux-x86_64, whose
# toolchain the proof shards use too) or is resolved here
# (.github/actions/toolchain): taken from a run on main, or built. Then
# ci/check.py runs the platform's planned checks one after another,
# each with its own log and record; a failing check does not stop the
# others, and the job fails at the end if any failed.
#
# Each check that passed leaves its record under build/records. They are
# uploaded as results-native-<platform> for the gates of this run, and from
# a run on main also as records-native-<platform>, the records pull
# requests reuse (ci/store.py). When agree runs, the job also uploads
# its toolchain's build record.

name: native

on:
  workflow_call:
    inputs:
      platform:
        description: "linux-x86_64, linux-aarch64 or macos-aarch64"
        type: string
        required: true
      runner:
        description: "Hosted runner label of the platform (ci/checks.toml)"
        type: string
        required: true
      jobs:
        description: "Parallel jobs of a toolchain build"
        type: number
        required: true
      need:
        description: "Toolchain the planned checks need: none, compiler or switch"
        type: string
        required: true
      resolve:
        description: "Resolve or build the toolchain in this job (otherwise fetch it)"
        type: boolean
        default: true
      toolchain-run:
        description: "With resolve false: the run holding the compiler bundle"
        type: string
        default: ""
      compiler-artifact:
        description: "With resolve false: the name of the compiler bundle"
        type: string
        default: ""
      switch-run:
        description: "With resolve false: the run holding the switch bundle"
        type: string
        default: ""
      switch-artifact:
        description: "With resolve false: the name of the switch bundle"
        type: string
        default: ""
      cold:
        description: "Build the toolchain from scratch and compare it with the stored build"
        type: boolean
        default: false
      main:
        description: "A run on main: upload the records"
        type: boolean
        default: false
      agree:
        description: "agree runs: upload the toolchain's build record"
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  native:
    name: native
    runs-on: ${{ inputs.runner }}
    # A toolchain built here (up to about 50 minutes on macOS, measured on
    # main) and the checks (about 30 minutes there).
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      PLATFORM: ${{ inputs.platform }}
      CI_RUNNER: ${{ inputs.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      - name: Install test dependencies
        run: ci/toolchain.sh deps run

      - name: Resolve or build the toolchain
        id: toolchain
        if: inputs.resolve && inputs.need != 'none'
        uses: ./.github/actions/toolchain
        with:
          platform: ${{ inputs.platform }}
          jobs: ${{ inputs.jobs }}
          need: ${{ inputs.need }}
          cold: ${{ inputs.cold }}
          main: ${{ inputs.main }}
          token: ${{ github.token }}

      - name: Put the compiler on the PATH
        if: inputs.resolve && inputs.need != 'none'
        run: ci/toolchain.sh bin-path

      - name: Fetch the toolchain of this run
        if: ${{ !inputs.resolve && inputs.need != 'none' }}
        uses: ./.github/actions/fetch-toolchain
        with:
          need: ${{ inputs.need }}
          compiler-run: ${{ inputs.toolchain-run }}
          compiler-artifact: ${{ inputs.compiler-artifact }}
          switch-run: ${{ inputs.switch-run }}
          switch-artifact: ${{ inputs.switch-artifact }}
          token: ${{ github.token }}

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: build/plan

      - name: Run the planned checks of this platform
        env:
          CI_BUILD_KEY: ${{ steps.toolchain.outputs.compiler-artifact || inputs.compiler-artifact }}
        run: python3 -I ci/check.py run-planned build/plan/plan.json "$PLATFORM"

      - name: Upload the results for this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-native-${{ inputs.platform }}
          path: build/records
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # Only passed checks have a record (ci/check.py), so the records
      # of the checks that passed are kept even when another one failed.
      - name: Upload the records for pull requests
        if: always() && inputs.main
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: records-native-${{ inputs.platform }}
          path: build/records
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90

      - name: Upload the toolchain's build record for agree
        if: inputs.agree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildrecord-${{ inputs.platform }}
          path: toolchain/work/logs
          if-no-files-found: error
          retention-days: 7
          overwrite: true
