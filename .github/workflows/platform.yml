#
# .github/workflows/platform.yml
# ==============================
#
# Everything CI establishes on one platform, natively on a hosted runner of
# that platform. Called by ci.yml once per platform; not run on its own.
#
#   toolchain     the pinned toolchain, built by toolchain/build.sh from its
#                 pins (Rocq proofs of the compiler, extraction, compiler
#                 build, the compiler's tests, and where the platform has
#                 EasyCrypt the check of the Jasmin EasyCrypt library), or
#                 restored from a cache entry of the same inputs; then
#                 packed as an artifact for the jobs below
#   test          ci-test: every test suite, natively; then the core
#                 transcript for the cross-platform comparison
#   analysis      ci-analysis: jasmin-ct and --sct for this architecture,
#                 and the emitted-code policies
#   differential  ci-diff: the library against an independent
#                 implementation
#   safety        ci-safety: jasmin-checksafety where the caller asks for
#                 it, a stated deferral otherwise
#   generated     ci-generated: shipped assembly against a regeneration
#
# Every job runs whatever it is given: none of them is skipped by a
# condition, so a job that did not run means a job before it failed. The
# check jobs run `make -f tools/ci/Makefile <target>`; a target whose
# component is not in the tree reports NOT APPLICABLE (tools/ci/Makefile).
#
# Recorded verdicts. Each check job first computes the key of its inputs
# (tools/ci/verdict.sh). When the caller sets reuse-verdicts, which ci.yml
# does for pull requests only, a recorded pass under that key is restored
# and reported in the job summary, with the run and commit that recorded
# it, and the job's remaining steps are skipped: the job succeeds without
# running the check again. Otherwise the check runs, and only when every
# step has passed is its verdict recorded and saved under the key. A failed
# check is never saved, so it runs again on the next attempt.
# The EasyCrypt proofs need the full prover set and run once, in ci.yml,
# with the switch of linux-x86_64 (outputs below).
#
# Caches. Two entries per platform, named by tools/ci/toolchain.sh keys:
# the opam switch and the compiler built on it. An entry is saved only after
# the steps that produce it have passed. Pull requests restore the entries
# saved on main; a pull request that changes a toolchain input has no entry
# and builds from scratch. What the entries hold and the cache budget are
# described in tools/ci/toolchain.sh. GitHub evicts entries independently; with one of
# the two evicted, the other is still valid (the compiler key contains the
# switch key) and only the missing one is rebuilt.
#
# Cancelling a superseded pull-request run (ci.yml) also cancels a cold
# toolchain build in progress. The switch entry is saved as soon as the
# switch is built, so a later push resumes from there; the compiler build
# starts again.
#
# Cold mode (scheduled runs). The toolchain is built from scratch whatever
# the caches hold, and must hold the same compiler, byte for byte, as the
# cached build of the same inputs. With no cached build to compare with,
# the cold build is saved as the entry and the job fails: a drift check
# that compared nothing is not a pass.

name: platform

on:
  workflow_call:
    inputs:
      platform:
        description: "Platform name: linux-x86_64, linux-aarch64, macos-aarch64"
        type: string
        required: true
      runner:
        description: "Hosted runner label of the platform"
        type: string
        required: true
      jobs:
        description: "Parallel jobs of the toolchain build (runner cores, bounded by memory)"
        type: number
        required: true
      toolchain-options:
        description: "Options of toolchain/build.sh before its step, e.g. --no-easycrypt"
        type: string
        default: ""
      safety:
        description: "Run jasmin-checksafety (true) or state its deferral (false)"
        type: boolean
        default: false
      cold:
        description: "Build the toolchain from scratch and compare it with the cached build"
        type: boolean
        default: false
      reuse-verdicts:
        description: "Report a recorded pass of a check whose inputs are unchanged instead of running it"
        type: boolean
        default: false
    outputs:
      switch-key:
        description: "Cache key of this platform's opam switch"
        value: ${{ jobs.toolchain.outputs.switch-key }}
      compiler-key:
        description: "Cache key of this platform's compiler"
        value: ${{ jobs.toolchain.outputs.compiler-key }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PLATFORM: ${{ inputs.platform }}
  TOOLCHAIN_OPTIONS: ${{ inputs.toolchain-options }}
  # The paths of the two cache entries, what they hold, and the cache
  # budget are in tools/ci/toolchain.sh (cache-paths).

jobs:
  toolchain:
    name: toolchain
    runs-on: ${{ inputs.runner }}
    # A build from scratch (opam switch, Rocq proofs, extraction, compiler,
    # tests) is bounded by the hosted-runner maximum of six hours.
    timeout-minutes: 360
    outputs:
      switch-key: ${{ steps.keys.outputs.switch-key }}
      compiler-key: ${{ steps.keys.outputs.compiler-key }}
    env:
      JOBS: ${{ inputs.jobs }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: tools/ci/toolchain.sh deps build

      - name: Compute cache keys
        id: keys
        run: tools/ci/toolchain.sh keys

      - name: Name the cache paths
        id: paths
        run: tools/ci/toolchain.sh cache-paths

      - name: Restore the opam switch
        id: switch
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.switch }}
          key: ${{ steps.keys.outputs.switch-key }}
          lookup-only: ${{ inputs.cold }}

      - name: Build the opam switch
        if: inputs.cold || steps.switch.outputs.cache-hit != 'true'
        run: toolchain/build.sh ${TOOLCHAIN_OPTIONS:+"$TOOLCHAIN_OPTIONS"} switch

      - name: Remove what only an installation reads
        if: steps.switch.outputs.cache-hit != 'true'
        run: tools/ci/toolchain.sh prune

      - name: Save the opam switch
        if: steps.switch.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.switch }}
          key: ${{ steps.keys.outputs.switch-key }}

      - name: Restore the compiler
        id: compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.compiler }}
          key: ${{ steps.keys.outputs.compiler-key }}
          lookup-only: ${{ inputs.cold }}

      - name: Build the compiler (proofs, extraction, compiler)
        if: inputs.cold || steps.compiler.outputs.cache-hit != 'true'
        run: toolchain/build.sh ${TOOLCHAIN_OPTIONS:+"$TOOLCHAIN_OPTIONS"} jasmin

      - name: Test the compiler
        if: inputs.cold || steps.compiler.outputs.cache-hit != 'true'
        run: toolchain/build.sh ${TOOLCHAIN_OPTIONS:+"$TOOLCHAIN_OPTIONS"} test

      - name: Save the compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.compiler }}
          key: ${{ steps.keys.outputs.compiler-key }}

      - name: Pack the compiler
        run: tools/ci/toolchain.sh pack "$RUNNER_TEMP/toolchain-$PLATFORM.tar.gz"

      - name: Upload the compiler
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-${{ inputs.platform }}
          path: ${{ runner.temp }}/toolchain-${{ inputs.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      # Cold mode: restore the cached build of the same inputs in place of
      # the cold one and require the same compiler; without one, fail.
      - name: Cold build without a cached build to compare with
        if: inputs.cold && steps.compiler.outputs.cache-hit != 'true'
        run: tools/ci/toolchain.sh no-cached-build

      - name: Set the cold build aside
        if: inputs.cold && steps.compiler.outputs.cache-hit == 'true'
        run: tools/ci/toolchain.sh clear

      - name: Restore the cached compiler
        if: inputs.cold && steps.compiler.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.compiler }}
          key: ${{ steps.keys.outputs.compiler-key }}
          fail-on-cache-miss: true

      - name: Compare the cold build with the cached build
        if: inputs.cold && steps.compiler.outputs.cache-hit == 'true'
        run: tools/ci/toolchain.sh compare-cached "$RUNNER_TEMP/toolchain-$PLATFORM.tar.gz"

  test:
    name: test
    needs: toolchain
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the verdict key
        id: verdict
        env:
          CI_TOOL_KEY: ${{ needs.toolchain.outputs.compiler-key }}
        run: make -s -f tools/ci/Makefile ci-verdict-key CHECK=test

      - name: Restore a recorded verdict
        id: recorded
        if: inputs.reuse-verdicts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verdict/test
          key: ${{ steps.verdict.outputs.key }}

      - name: Report the recorded verdict
        if: steps.recorded.outputs.cache-hit == 'true'
        env:
          KEY: ${{ steps.verdict.outputs.key }}
        run: tools/ci/verdict.sh report test "$KEY"

      - name: Install test dependencies
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/toolchain.sh deps run

      - name: Download the compiler
        if: steps.recorded.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-${{ inputs.platform }}
          path: ${{ runner.temp }}/artifact

      - name: Install the compiler
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/toolchain.sh install "$RUNNER_TEMP/artifact/toolchain-$PLATFORM.tar.gz" "$RUNNER_TEMP/toolchain"

      - name: Download the test vectors
        if: steps.recorded.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vectors
          path: build

      - name: Run the tests
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/verdict.sh run test make -f tools/ci/Makefile ci-test

      - name: Write the core transcript
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/verdict.sh run test make -f tools/ci/Makefile ci-transcript

      - name: Record the verdict
        if: steps.recorded.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.verdict.outputs.key }}
        run: tools/ci/verdict.sh record test "$KEY" build/ci/transcript-*.txt

      - name: Save the verdict
        if: steps.recorded.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verdict/test
          key: ${{ steps.verdict.outputs.key }}

      # After a reused verdict, the transcript is the recorded one.
      - name: Upload the core transcript
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-${{ inputs.platform }}
          path: build/ci/transcript-*.txt
          if-no-files-found: error
          retention-days: 14

  analysis:
    name: analysis
    needs: toolchain
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the verdict key
        id: verdict
        env:
          CI_TOOL_KEY: ${{ needs.toolchain.outputs.compiler-key }}
        run: make -s -f tools/ci/Makefile ci-verdict-key CHECK=analysis

      - name: Restore a recorded verdict
        id: recorded
        if: inputs.reuse-verdicts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verdict/analysis
          key: ${{ steps.verdict.outputs.key }}

      - name: Report the recorded verdict
        if: steps.recorded.outputs.cache-hit == 'true'
        env:
          KEY: ${{ steps.verdict.outputs.key }}
        run: tools/ci/verdict.sh report analysis "$KEY"

      - name: Install dependencies
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/toolchain.sh deps run

      - name: Download the compiler
        if: steps.recorded.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-${{ inputs.platform }}
          path: ${{ runner.temp }}/artifact

      - name: Install the compiler
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/toolchain.sh install "$RUNNER_TEMP/artifact/toolchain-$PLATFORM.tar.gz" "$RUNNER_TEMP/toolchain"

      - name: Constant-time, speculative constant-time and emitted-code checks
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/verdict.sh run analysis make -f tools/ci/Makefile ci-analysis

      - name: Record the verdict
        if: steps.recorded.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.verdict.outputs.key }}
        run: tools/ci/verdict.sh record analysis "$KEY"

      - name: Save the verdict
        if: steps.recorded.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verdict/analysis
          key: ${{ steps.verdict.outputs.key }}

  differential:
    name: differential
    needs: toolchain
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the verdict key
        id: verdict
        env:
          CI_TOOL_KEY: ${{ needs.toolchain.outputs.compiler-key }}
        run: make -s -f tools/ci/Makefile ci-verdict-key CHECK=differential

      - name: Restore a recorded verdict
        id: recorded
        if: inputs.reuse-verdicts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verdict/differential
          key: ${{ steps.verdict.outputs.key }}

      - name: Report the recorded verdict
        if: steps.recorded.outputs.cache-hit == 'true'
        env:
          KEY: ${{ steps.verdict.outputs.key }}
        run: tools/ci/verdict.sh report differential "$KEY"

      - name: Install dependencies
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/toolchain.sh deps run

      - name: Download the compiler
        if: steps.recorded.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-${{ inputs.platform }}
          path: ${{ runner.temp }}/artifact

      - name: Install the compiler
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/toolchain.sh install "$RUNNER_TEMP/artifact/toolchain-$PLATFORM.tar.gz" "$RUNNER_TEMP/toolchain"

      - name: Differential test against an independent implementation
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/verdict.sh run differential make -f tools/ci/Makefile ci-diff

      - name: Record the verdict
        if: steps.recorded.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.verdict.outputs.key }}
        run: tools/ci/verdict.sh record differential "$KEY"

      - name: Save the verdict
        if: steps.recorded.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verdict/differential
          key: ${{ steps.verdict.outputs.key }}

  # jasmin-checksafety loads the switch's libraries, so this job restores
  # both caches instead of the packed compiler; on a deferring event it
  # restores nothing and states the deferral.
  safety:
    name: safety
    needs: toolchain
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      CI_SAFETY: ${{ inputs.safety && 'run' || 'defer' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        if: inputs.safety
        run: tools/ci/toolchain.sh deps build

      - name: Name the cache paths
        id: paths
        if: inputs.safety
        run: tools/ci/toolchain.sh cache-paths

      - name: Restore the opam switch
        if: inputs.safety
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.switch }}
          key: ${{ needs.toolchain.outputs.switch-key }}
          fail-on-cache-miss: true

      - name: Restore the compiler
        if: inputs.safety
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.compiler }}
          key: ${{ needs.toolchain.outputs.compiler-key }}
          fail-on-cache-miss: true

      - name: Put the cached tools on the PATH
        if: inputs.safety
        run: tools/ci/toolchain.sh bin-path

      - name: Safety checks
        run: make -f tools/ci/Makefile ci-safety

  generated:
    name: generated
    needs: toolchain
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the verdict key
        id: verdict
        env:
          CI_TOOL_KEY: ${{ needs.toolchain.outputs.compiler-key }}
        run: make -s -f tools/ci/Makefile ci-verdict-key CHECK=generated

      - name: Restore a recorded verdict
        id: recorded
        if: inputs.reuse-verdicts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verdict/generated
          key: ${{ steps.verdict.outputs.key }}

      - name: Report the recorded verdict
        if: steps.recorded.outputs.cache-hit == 'true'
        env:
          KEY: ${{ steps.verdict.outputs.key }}
        run: tools/ci/verdict.sh report generated "$KEY"

      - name: Install dependencies
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/toolchain.sh deps run

      - name: Download the compiler
        if: steps.recorded.outputs.cache-hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain-${{ inputs.platform }}
          path: ${{ runner.temp }}/artifact

      - name: Install the compiler
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/toolchain.sh install "$RUNNER_TEMP/artifact/toolchain-$PLATFORM.tar.gz" "$RUNNER_TEMP/toolchain"

      - name: Regenerate the shipped assembly and compare
        if: steps.recorded.outputs.cache-hit != 'true'
        run: tools/ci/verdict.sh run generated make -f tools/ci/Makefile ci-generated

      - name: Record the verdict
        if: steps.recorded.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.verdict.outputs.key }}
        run: tools/ci/verdict.sh record generated "$KEY"

      - name: Save the verdict
        if: steps.recorded.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verdict/generated
          key: ${{ steps.verdict.outputs.key }}
