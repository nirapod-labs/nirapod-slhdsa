#
# .github/workflows/ci.yml
# ========================
#
# The checks a change must pass to reach main, on hosted runners only,
# natively on each supported platform:
#
#   linux-x86_64    ubuntu-24.04       x86-64, Linux, ELF
#   linux-aarch64   ubuntu-24.04-arm   AArch64, Linux, ELF (compiler only:
#                                      the pinned provers have no binaries
#                                      for it)
#   macos-aarch64   macos-26           AArch64, macOS, Mach-O
#
# What runs where is in one registry, ci/checks.toml, and each check
# is one recipe, ci/checks/<recipe>.mk, which runs on a workstation
# with the same command (ci/README.md).
#
# Order, cheapest first. lint, reuse and source need no toolchain and
# finish within a minute. Then `plan` (ci/plan.py) computes the key
# of every check on every platform: the SHA-256 of what the check reads,
# the toolchain's source files and the runner label (ci/key.py). On
# a pull request it looks up, through the API, the records of runs of this
# workflow on main; a check is reported with the pass the newest run on
# main that ran it under the same key recorded, instead of running again,
# and only the checks without one start a job: a change to the
# documentation starts no platform job at all. A check whose component is not in the tree is NOT
# APPLICABLE, and the safety check NOT RUN while the tree has Jasmin code
# but no safety component; the plan decides both from the tree on every
# run. Pushes to main, the cold schedule and manual runs other than warm
# ones reuse no check: they run every one, and record each pass for pull
# requests to reuse. The push of a release tag (v*) reuses no check either
# and runs every one. Its results stay artifacts of its own run, for seven
# days, and are not offered to pull requests, which reuse records of main
# only (ci/record.py). Its source job also requires the tag's name to match
# the version of the header, CITATION.cff and CHANGELOG.md (ci/version.py).
#
# Then, as the plan says: the linux-x86_64 toolchain, taken from a run on
# main or built (.github/actions/toolchain); one job per platform with that
# platform's checks (native.yml); the EasyCrypt proofs as parallel shards
# (proofs/Makefile, check-shard) behind the gate `proofs`; agree, which
# compares the platforms with each other. Each job that runs a check
# computes its key again and fails if it differs from the plan's.
#
# The job `all-checks` is the status check branch protection requires
# (with `changelog`, a workflow of its own). It succeeds only when every
# job the plan gave work succeeded, every other job was skipped, the plan
# agrees with the tree, and every check has a PASS record from this run or
# a valid reused record (ci/gate.py).
#
# Weekly, the same workflow runs in cold mode: each platform builds its
# toolchain from scratch, ignoring the stored builds, and compares the
# result with the stored build (ci/toolchain.py cold-compare).
#
# Daily, it runs in warm mode, and only the job `warm` runs: on each runner
# that resolves a toolchain in a run on main (the linux-x86_64 toolchain
# job and the native jobs of the other platforms), it computes the build
# keys, whose host identity changes with every runner image update, and
# stops if runs on main hold the bundles of those keys. Otherwise it builds
# and stores them as a push to main does, so that pull requests find them
# instead of building the toolchain themselves (ci/toolchain.py warm). No
# check runs in warm mode, and nothing but the bundles is uploaded.
#
# No secrets are used and no job writes outside its own run: the token can
# read the repository and its Actions runs and artifacts, and checkouts do
# not keep it. Nothing is taken from the Actions cache.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    # A release tag: every check runs, as on main, and nothing is reused.
    tags: ["v*"]
  schedule:
    # Cold, Mondays.
    - cron: "17 3 * * 1"
    # Warm, daily.
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      cold:
        description: "Build the toolchain from scratch and compare it with the stored build"
        type: boolean
        default: false
      warm:
        description: "Only build and store the toolchain bundles main lacks for the current runner images"
        type: boolean
        default: false

permissions: {}

# A new push to a pull request cancels the run on its previous head. Every
# other run (main, the schedule, manual runs) has a group of its own: a
# shared group would let a later run cancel a pending one, such as the
# weekly cold build, without a trace.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# The cron lines tell the modes apart. Job conditions and the inputs of
# called workflows, where `env` is not available, repeat the expressions
# of the cold mode here and of the warm mode (the job `warm`).
env:
  COLD: ${{ github.event.schedule == '17 3 * * 1' || inputs.cold == true }}
  MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    if: ${{ !(github.event.schedule == '43 4 * * *' || inputs.warm == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      - name: Install actionlint, ShellCheck and zizmor
        run: python3 -I ci/lint.py install "$RUNNER_TEMP/lint"

      - name: Check the workflows, shell scripts and Python scripts
        run: python3 -I ci/lint.py

      - name: Run the tests of the CI scripts
        run: python3 -I -m unittest discover -s ci/tests

      - name: Run the tests of the benchmark harness
        run: python3 -I bench/test_bench.py

  reuse:
    name: reuse
    if: ${{ !(github.event.schedule == '43 4 * * *' || inputs.warm == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      - name: Copyright and licence information of every file
        run: python3 -I ci/lint.py reuse

  source:
    name: source
    if: ${{ !(github.event.schedule == '43 4 * * *' || inputs.warm == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      - name: Components, recipes, proof shards, constant tables, generated sources, proof holes
        run: python3 -I ci/source.py

  plan:
    name: plan
    needs: [lint, reuse, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      native-linux-x86_64: ${{ steps.plan.outputs.native-linux-x86_64 }}
      native-linux-aarch64: ${{ steps.plan.outputs.native-linux-aarch64 }}
      native-macos-aarch64: ${{ steps.plan.outputs.native-macos-aarch64 }}
      need-linux-x86_64: ${{ steps.plan.outputs.need-linux-x86_64 }}
      need-linux-aarch64: ${{ steps.plan.outputs.need-linux-aarch64 }}
      need-macos-aarch64: ${{ steps.plan.outputs.need-macos-aarch64 }}
      toolchain-x86: ${{ steps.plan.outputs.toolchain-x86 }}
      need-x86: ${{ steps.plan.outputs.need-x86 }}
      shards: ${{ steps.plan.outputs.shards }}
      agree: ${{ steps.plan.outputs.agree }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      - name: Keys of every check, records on main, the checks to run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I ci/plan.py build/plan

      # Kept as long as the records on main: a later pull request reads it
      # to tell which checks a run on main ran (ci/store.py).
      - name: Upload the plan and the reused records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: build/plan
          if-no-files-found: error
          retention-days: ${{ env.MAIN == 'true' && 90 || 7 }}
          overwrite: true

  # The linux-x86_64 toolchain, for the linux-x86_64 checks and the proof
  # shards, which take it from this job's outputs.
  toolchain-x86:
    name: toolchain linux-x86_64
    needs: plan
    if: needs.plan.outputs.toolchain-x86 == 'true'
    runs-on: ubuntu-24.04
    # A build from scratch (opam switch, Rocq proofs, extraction, compiler,
    # tests) is bounded by the hosted-runner maximum of six hours.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    outputs:
      switch-run: ${{ steps.toolchain.outputs.switch-run }}
      compiler-run: ${{ steps.toolchain.outputs.compiler-run }}
      switch-artifact: ${{ steps.toolchain.outputs.switch-artifact }}
      compiler-artifact: ${{ steps.toolchain.outputs.compiler-artifact }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      - name: Resolve or build the toolchain
        id: toolchain
        uses: ./.github/actions/toolchain
        with:
          platform: linux-x86_64
          jobs: 4
          need: ${{ needs.plan.outputs.need-x86 }}
          cold: ${{ env.COLD }}
          main: ${{ env.MAIN }}
          token: ${{ github.token }}

  # Runs after the toolchain job, or without it when the planned checks
  # need no toolchain.
  native-linux-x86_64:
    name: linux-x86_64
    needs: [plan, toolchain-x86]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.native-linux-x86_64 == 'true'
      && (needs.toolchain-x86.result == 'success'
          || (needs.toolchain-x86.result == 'skipped' && needs.plan.outputs.need-linux-x86_64 == 'none'))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native.yml
    with:
      platform: linux-x86_64
      runner: ubuntu-24.04
      jobs: 4
      need: ${{ needs.plan.outputs.need-linux-x86_64 }}
      resolve: false
      toolchain-run: ${{ needs.toolchain-x86.outputs.compiler-run }}
      compiler-artifact: ${{ needs.toolchain-x86.outputs.compiler-artifact }}
      switch-run: ${{ needs.toolchain-x86.outputs.switch-run }}
      switch-artifact: ${{ needs.toolchain-x86.outputs.switch-artifact }}
      main: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      agree: ${{ needs.plan.outputs.agree == 'true' }}

  native-linux-aarch64:
    name: linux-aarch64
    needs: plan
    if: needs.plan.outputs.native-linux-aarch64 == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native.yml
    with:
      platform: linux-aarch64
      runner: ubuntu-24.04-arm
      jobs: 4
      need: ${{ needs.plan.outputs.need-linux-aarch64 }}
      cold: ${{ github.event.schedule == '17 3 * * 1' || inputs.cold == true }}
      main: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      agree: ${{ needs.plan.outputs.agree == 'true' }}

  native-macos-aarch64:
    name: macos-aarch64
    needs: plan
    if: needs.plan.outputs.native-macos-aarch64 == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native.yml
    with:
      platform: macos-aarch64
      runner: macos-26
      # Three cores and 7 GB of memory: two parallel jobs leave a margin.
      jobs: 2
      need: ${{ needs.plan.outputs.need-macos-aarch64 }}
      cold: ${{ github.event.schedule == '17 3 * * 1' || inputs.cold == true }}
      main: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      agree: ${{ needs.plan.outputs.agree == 'true' }}

  # The EasyCrypt development in shards, each a job with the linux-x86_64
  # switch (the pinned provers), its files checked in parallel.
  proof-shards:
    name: proofs ${{ matrix.leg.shard }}
    needs: [plan, toolchain-x86]
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      CI_RUNNER: ubuntu-24.04
      SHARD: ${{ matrix.leg.shard }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      # The libraries the switch links against.
      - name: Install build dependencies
        run: ci/toolchain.sh deps build

      - name: Fetch the toolchain of this run
        uses: ./.github/actions/fetch-toolchain
        with:
          need: ${{ matrix.leg.need }}
          compiler-run: ${{ needs.toolchain-x86.outputs.compiler-run }}
          compiler-artifact: ${{ needs.toolchain-x86.outputs.compiler-artifact }}
          switch-run: ${{ needs.toolchain-x86.outputs.switch-run }}
          switch-artifact: ${{ needs.toolchain-x86.outputs.switch-artifact }}
          token: ${{ github.token }}

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: build/plan

      - name: Check the shard
        env:
          CI_BUILD_KEY: ${{ needs.toolchain-x86.outputs.compiler-artifact }}
        run: python3 -I ci/check.py run-planned build/plan/plan.json linux-x86_64 "$SHARD"

      - name: Upload the result for this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-proofs-${{ matrix.leg.shard }}
          path: build/records
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Upload the record for pull requests
        if: always() && env.MAIN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: records-proofs-${{ matrix.leg.shard }}
          path: build/records
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90

  # Every shard passed, here or in a reused record, and the shards are
  # those of proofs/Makefile. It runs when no shard ran, too.
  proofs:
    name: proofs
    needs: [plan, proof-shards]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: build/plan

      # Nothing to download when every shard was reused; a missing result
      # of a shard that ran fails the gate below.
      - name: Download the shard results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-proofs-*
          merge-multiple: true
          path: build/results

      - name: Every shard passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I ci/gate.py proofs "$NEEDS" build/plan build/results

  agree:
    name: agree
    needs: [plan, native-linux-x86_64, native-linux-aarch64, native-macos-aarch64]
    if: needs.plan.outputs.agree == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: build/plan

      - name: Download the platform results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-native-*
          merge-multiple: true
          path: build/results

      - name: Download the toolchains' build records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: buildrecord-*
          path: build/builds

      - name: Same extracted compiler, assumptions and core transcripts on every platform
        run: python3 -I ci/check.py agree build/plan/plan.json build/results build/builds

      - name: Upload the result for this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-agree
          path: build/records
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Upload the record for pull requests
        if: env.MAIN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: records-agree
          path: build/records
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  # Warm mode: the toolchain of every platform for the current runner
  # images, built and stored only when no run on main holds it.
  warm:
    name: warm ${{ matrix.leg.platform }}
    if: github.event.schedule == '43 4 * * *' || inputs.warm == true
    runs-on: ${{ matrix.leg.runner }}
    # A build from scratch, as in toolchain-x86.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # The runners and parallel jobs of the jobs that resolve a toolchain
      # in a run on main; the native ones install the test dependencies
      # first, which can change the host identity.
      matrix:
        leg:
          - {platform: linux-x86_64, runner: ubuntu-24.04, jobs: 4, native: false}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm, jobs: 4, native: true}
          - {platform: macos-aarch64, runner: macos-26, jobs: 2, native: true}
    env:
      PLATFORM: ${{ matrix.leg.platform }}
    steps:
      - name: One mode per run
        if: inputs.cold == true
        run: |
          echo "::error::cold and warm were both requested; run them separately"
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      - name: Install test dependencies
        if: matrix.leg.native
        run: ci/toolchain.sh deps run

      - name: Install build dependencies
        run: ci/toolchain.sh deps build

      - name: The toolchain a run on main resolves here, and whether main holds it
        id: warm
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I ci/toolchain.py warm "$PLATFORM"

      - name: Build and store what main lacks
        if: steps.warm.outputs.build == 'true'
        uses: ./.github/actions/toolchain
        with:
          platform: ${{ matrix.leg.platform }}
          jobs: ${{ matrix.leg.jobs }}
          need: ${{ steps.warm.outputs.need }}
          cold: false
          main: ${{ env.MAIN }}
          token: ${{ github.token }}

  # Skipped in warm mode, which runs no check.
  all-checks:
    name: all-checks
    if: ${{ always() && !(github.event.schedule == '43 4 * * *' || inputs.warm == true) }}
    needs: [lint, reuse, source, plan, toolchain-x86, native-linux-x86_64, native-linux-aarch64,
            native-macos-aarch64, proof-shards, proofs, agree, warm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: ./.github/actions/python

      - name: Download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: build/plan

      # Nothing to download when every check was reused; a missing result
      # of a check that ran fails the gate below.
      - name: Download the results of this run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true
          path: build/results

      - name: Every job the plan gave work succeeded, and every check passed or was reused
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 -I ci/gate.py all-checks .github/workflows/ci.yml "$NEEDS" build/plan build/results
