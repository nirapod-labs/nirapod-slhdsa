#
# .github/actions/python/action.yml
# =================================
#
# The Python that runs the CI scripts under tools/ci, one exact version on
# every runner, so that a script behaves the same on all three platforms
# and does not change with a runner image. Standard library only: nothing
# is installed into it.

name: python
description: Put the pinned Python on the PATH
runs:
  using: composite
  steps:
    - name: Set up Python 3.13.16
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13.16"
        check-latest: false
        update-environment: true
