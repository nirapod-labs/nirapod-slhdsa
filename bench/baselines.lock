#
# Independent SLH-DSA implementations used as test oracles and performance
# baselines. bench/baselines.py fetches exactly these revisions and refuses
# anything else. None of them is built into this library.
#
# git <name> <url> <commit>
#   The checkout must resolve to the commit.
# archive <name> <url> <bytes> <sha256>
#   A .tar.gz or .zip release; the download must match size and digest.
#   For OpenSSL these are the digests published beside each release.
# openpgp <name> <signature url> <primary key fingerprint> <keyring url>
#   `baselines.py verify` checks the archive's detached signature and that
#   the key that made it belongs to that primary key (OpenSSL's
#   release-signing key; its signing subkey is
#   C46ED3F2CBEFDA1FDAADA44264ED7B1DCCE71CB2).
# sameas <name> <git url> <commit> <path>...
#   `baselines.py verify` checks that these files of the archive are
#   byte-identical to the same paths at that commit.
#
# slhdsa-c: PQ Code Package, main branch.
# sphincsplus: the SPHINCS+ team's code, branch bas/fips205, which tracks
#   FIPS 205 (context strings, HashSLH-DSA framing, deterministic addrnd =
#   PK.seed). The master branch still implements round-3 SPHINCS+ and is not
#   a FIPS 205 baseline.
# openssl-3.6.5: latest 3.x release; openssl-4.0.3: latest stable release.
#   Both implement SLH-DSA itself in C without SIMD, over OpenSSL's own SHA-2
#   and Keccak code (assembly where the CPU has it); 4.0 calls the SHA-2
#   block functions directly instead of through EVP, so both are measured.
# wolfssl-5.9.4: latest release with SLH-DSA (wc_slhdsa.c), as the
#   configured source archive wolfSSL publishes (no detached signature is
#   published beside it); the sameas line ties its SLH-DSA and hash sources
#   to git tag v5.9.4-stable. GPL-3.0: built and run as a baseline only,
#   never vendored or distributed.
# boringssl: main branch; implements SLH-DSA-SHA2-128s and SLH-DSA-SHAKE-256f
#   only. Built with CMake (must be on PATH), crypto library only.

