#
# tools/ci/rules/proofs-extraction.toml: the extraction shard
# (tools/ci/counts.py). A minimum is the count of the complete run on the
# current tree; lowering one is a reviewed change.

[extraction]
[[extraction.line]]
what = "pairs whose committed model equals a fresh extraction"
pattern = '^check-extraction: PASS \((\d+) pairs\)$'
minimum = 2
