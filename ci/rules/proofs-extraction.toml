#
# ci/rules/proofs-extraction.toml: the extraction shard
# (ci/counts.py). A minimum is the count of the complete run on the
# current tree; lowering one is a reviewed change.

[extraction]
[[extraction.line]]
what = "pairs whose committed model equals a fresh extraction"
pattern = '^check-extraction: PASS \((\d+) pairs, \d+ per-set models\)$'
minimum = 3

[[extraction.line]]
what = "per-set models (12 sets for each pair in CORE_PAIRS) equal to a fresh extraction"
pattern = '^check-extraction: PASS \(\d+ pairs, (\d+) per-set models\)$'
minimum = 24
