#
# ci/rules/proofs-x86_64-portable-shake-f.toml: the shake-f sets against the x86_64/portable
# models: the per-set proofs and inventories
# (ci/counts.py). A minimum is the count of the complete run on the
# current tree; lowering one is a reviewed change.

[x86_64-portable-shake-f]
[[x86_64-portable-shake-f.line]]
what = "files of shake_128f: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set x86_64/portable/shake_128f: PASS (\d+) files$'
minimum = 51

[[x86_64-portable-shake-f.line]]
what = "theorems in the unchanged inventory of x86_64/portable/shake_128f (Encoding 2, DigestIndices 2, Wots 1, WotsChain 1, WotsPk 1, WotsLeaf 1, XmssPk 1, TreeFold 1, Xmss 2, ForsPk 1, ForsTree 1, ForsSign 1, Hypertree 2, Thash 7, PreHash 3, ThashX4 4, Theorems 8)"
pattern = '^inventory x86_64/portable/shake_128f: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 39

[[x86_64-portable-shake-f.line]]
what = "files of shake_192f: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set x86_64/portable/shake_192f: PASS (\d+) files$'
minimum = 55

[[x86_64-portable-shake-f.line]]
what = "theorems in the unchanged inventory of x86_64/portable/shake_192f (Encoding 2, DigestIndices 2, Wots 1, WotsChain 1, WotsPk 1, WotsLeaf 1, XmssPk 1, TreeFold 1, Xmss 2, ForsPk 1, ForsTree 1, ForsSign 1, Hypertree 2, Thash 7, PreHash 3, ThashX4 4, Theorems 8)"
pattern = '^inventory x86_64/portable/shake_192f: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 39

[[x86_64-portable-shake-f.line]]
what = "files of shake_256f: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set x86_64/portable/shake_256f: PASS (\d+) files$'
minimum = 50

[[x86_64-portable-shake-f.line]]
what = "theorems in the unchanged inventory of x86_64/portable/shake_256f (Encoding 2, DigestIndices 2, Wots 1, WotsChain 1, WotsPk 1, WotsLeaf 1, XmssPk 1, TreeFold 1, Xmss 2, ForsPk 1, ForsTree 1, ForsSign 1, Hypertree 2, Thash 7, PreHash 3, ThashX4 4, Theorems 8)"
pattern = '^inventory x86_64/portable/shake_256f: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 39

[[x86_64-portable-shake-f.line]]
what = "sets of the shake-f group checked against the x86_64/portable models"
pattern = '^check-sets x86_64-portable-shake-f: PASS (\d+) sets$'
minimum = 3
