#
# ci/rules/test-core.toml: coverage minimum of the core transcript
# (ci/counts.py). A minimum is the count of the complete run on the
# current vectors and settings; lowering one is a reviewed change.

# Seven lines for each of the 12 parameter sets. A minimum only: whether
# the lines are right is checked by agree, byte for byte across the
# platforms, and by the tests that wrote them.
[transcript]
[[transcript.nonblank]]
what = "core transcript"
minimum = 84

# The fills of the SLH-DSA core that tests/core/fill-check.py rewrites; the
# script fails on any other count itself, this holds the number it reports.
[fill-check]
[[fill-check.line]]
what = "fill sites rewritten with 0xa5 bytes"
pattern = '^fill-check: sites=(\d+)$'
exactly = 6

# The fill check's controls (linux-aarch64 only), one per filled buffer:
# every one detected.
[fill-controls]
[[fill-controls.line]]
what = "filled buffers whose control the fill check detected"
pattern = '^fill-check controls: detected=(\d+) of 8$'
exactly = 8
