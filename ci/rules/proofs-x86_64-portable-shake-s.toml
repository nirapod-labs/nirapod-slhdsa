#
# ci/rules/proofs-x86_64-portable-shake-s.toml: the shake-s sets against the x86_64/portable
# models: the per-set proofs and inventories
# (ci/counts.py). A minimum is the count of the complete run on the
# current tree; lowering one is a reviewed change.

[x86_64-portable-shake-s]
[[x86_64-portable-shake-s.line]]
what = "files of shake_128s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set x86_64/portable/shake_128s: PASS (\d+) files$'
minimum = 32

[[x86_64-portable-shake-s.line]]
what = "theorems in the unchanged inventory of x86_64/portable/shake_128s (Encoding 2)"
pattern = '^inventory x86_64/portable/shake_128s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 2

[[x86_64-portable-shake-s.line]]
what = "files of shake_192s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set x86_64/portable/shake_192s: PASS (\d+) files$'
minimum = 35

[[x86_64-portable-shake-s.line]]
what = "theorems in the unchanged inventory of x86_64/portable/shake_192s (Encoding 2)"
pattern = '^inventory x86_64/portable/shake_192s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 2

[[x86_64-portable-shake-s.line]]
what = "files of shake_256s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set x86_64/portable/shake_256s: PASS (\d+) files$'
minimum = 31

[[x86_64-portable-shake-s.line]]
what = "theorems in the unchanged inventory of x86_64/portable/shake_256s (Encoding 2)"
pattern = '^inventory x86_64/portable/shake_256s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 2

[[x86_64-portable-shake-s.line]]
what = "sets of the shake-s group checked against the x86_64/portable models"
pattern = '^check-sets x86_64-portable-shake-s: PASS (\d+) sets$'
minimum = 3
