#
# ci/rules/analysis-units.toml: the jasmin-ct and --sct records of make ct
# (ci/counts.py). A minimum is the count of the complete run on the
# current vectors and settings; lowering one is a reviewed change.

# One unit per parameter set and variant: twelve sets, each with a scalar
# unit and an accelerated unit (Makefile, UNITS). Stated here
# apart from the Makefile, so that a unit dropped from the build fails
# this check rather than leaving the analysis.
[ct]
[[ct.files]]
what = "units analysed"
glob = "{target}/ct/*.ok"
exactly = { x86_64 = 24, aarch64 = 24 }

[[ct.files]]
what = "jasmin-ct records"
glob = "{target}/ct/*.ct.log"
exactly = { x86_64 = 24, aarch64 = 24 }

[[ct.files]]
what = "jasmin-ct --sct records"
glob = "{target}/ct/*.sct.log"
exactly = { x86_64 = 24, aarch64 = 24 }
