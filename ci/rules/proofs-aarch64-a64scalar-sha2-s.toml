#
# ci/rules/proofs-aarch64-a64scalar-sha2-s.toml: the sha2-s sets against the aarch64/a64scalar
# models: the per-set proofs and inventories
# (ci/counts.py). A minimum is the count of the complete run on the
# current tree; lowering one is a reviewed change.

[aarch64-a64scalar-sha2-s]
[[aarch64-a64scalar-sha2-s.line]]
what = "files of sha2_128s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set aarch64/a64scalar/sha2_128s: PASS (\d+) files$'
minimum = 46

[[aarch64-a64scalar-sha2-s.line]]
what = "theorems in the unchanged inventory of aarch64/a64scalar/sha2_128s (Encoding 2, DigestIndices 2, Wots 1, WotsChain 1, WotsPk 1, ADRSc 2, Thash 4)"
pattern = '^inventory aarch64/a64scalar/sha2_128s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 13

[[aarch64-a64scalar-sha2-s.line]]
what = "files of sha2_192s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set aarch64/a64scalar/sha2_192s: PASS (\d+) files$'
minimum = 49

[[aarch64-a64scalar-sha2-s.line]]
what = "theorems in the unchanged inventory of aarch64/a64scalar/sha2_192s (Encoding 2, DigestIndices 2, Wots 1, WotsChain 1, WotsPk 1, ADRSc 2, Thash 4)"
pattern = '^inventory aarch64/a64scalar/sha2_192s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 13

[[aarch64-a64scalar-sha2-s.line]]
what = "files of sha2_256s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set aarch64/a64scalar/sha2_256s: PASS (\d+) files$'
minimum = 44

[[aarch64-a64scalar-sha2-s.line]]
what = "theorems in the unchanged inventory of aarch64/a64scalar/sha2_256s (Encoding 2, DigestIndices 2, Wots 1, WotsChain 1, WotsPk 1, ADRSc 2, Thash 4)"
pattern = '^inventory aarch64/a64scalar/sha2_256s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 13

[[aarch64-a64scalar-sha2-s.line]]
what = "sets of the sha2-s group checked against the aarch64/a64scalar models"
pattern = '^check-sets aarch64-a64scalar-sha2-s: PASS (\d+) sets$'
minimum = 3
