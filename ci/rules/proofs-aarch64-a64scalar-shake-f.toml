#
# ci/rules/proofs-aarch64-a64scalar-shake-f.toml: the shake-f sets against the aarch64/a64scalar
# models: the per-set proofs and inventories
# (ci/counts.py). A minimum is the count of the complete run on the
# current tree; lowering one is a reviewed change.

[aarch64-a64scalar-shake-f]
[[aarch64-a64scalar-shake-f.line]]
what = "files of shake_128f: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set aarch64/a64scalar/shake_128f: PASS (\d+) files$'
minimum = 31

[[aarch64-a64scalar-shake-f.line]]
what = "theorems in the unchanged inventory of aarch64/a64scalar/shake_128f (Encoding 2)"
pattern = '^inventory aarch64/a64scalar/shake_128f: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 2

[[aarch64-a64scalar-shake-f.line]]
what = "files of shake_192f: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set aarch64/a64scalar/shake_192f: PASS (\d+) files$'
minimum = 35

[[aarch64-a64scalar-shake-f.line]]
what = "theorems in the unchanged inventory of aarch64/a64scalar/shake_192f (Encoding 2)"
pattern = '^inventory aarch64/a64scalar/shake_192f: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 2

[[aarch64-a64scalar-shake-f.line]]
what = "files of shake_256f: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set aarch64/a64scalar/shake_256f: PASS (\d+) files$'
minimum = 30

[[aarch64-a64scalar-shake-f.line]]
what = "theorems in the unchanged inventory of aarch64/a64scalar/shake_256f (Encoding 2)"
pattern = '^inventory aarch64/a64scalar/shake_256f: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 2

[[aarch64-a64scalar-shake-f.line]]
what = "sets of the shake-f group checked against the aarch64/a64scalar models"
pattern = '^check-sets aarch64-a64scalar-shake-f: PASS (\d+) sets$'
minimum = 3
