#
# ci/rules/proofs-spec.toml: files the proof shard spec checks
# (ci/counts.py). A minimum is the count of the complete run on the
# current tree; lowering one is a reviewed change.

[spec]
[[spec.line]]
what = "this project's specification and security theories, every file checked"
pattern = '^shard spec: PASS (\d+) files$'
minimum = 32
