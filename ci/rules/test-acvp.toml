#
# ci/rules/test-acvp.toml: minimum count of the ACVP run
# (ci/counts.py). A minimum is the count of the complete run on the
# current vectors and settings; lowering one is a reviewed change.

[acvp]
[[acvp.line]]
what = "ACVP cases, all run and passed"
pattern = '^acvp: impl=\S+ variant=\S+ control=none groups=\d+ cases=(\d+) pass=\d+ fail=0 notrun=0 filtered=0 verdict=PASS$'
minimum = 1248
