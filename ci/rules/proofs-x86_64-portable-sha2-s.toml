#
# ci/rules/proofs-x86_64-portable-sha2-s.toml: the sha2-s sets against the x86_64/portable
# models: the per-set proofs and inventories
# (ci/counts.py). A minimum is the count of the complete run on the
# current tree; lowering one is a reviewed change.

[x86_64-portable-sha2-s]
[[x86_64-portable-sha2-s.line]]
what = "files of sha2_128s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set x86_64/portable/sha2_128s: PASS (\d+) files$'
minimum = 40

[[x86_64-portable-sha2-s.line]]
what = "theorems in the unchanged inventory of x86_64/portable/sha2_128s (Encoding 2, ADRSc 2)"
pattern = '^inventory x86_64/portable/sha2_128s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 4

[[x86_64-portable-sha2-s.line]]
what = "files of sha2_192s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set x86_64/portable/sha2_192s: PASS (\d+) files$'
minimum = 43

[[x86_64-portable-sha2-s.line]]
what = "theorems in the unchanged inventory of x86_64/portable/sha2_192s (Encoding 2, ADRSc 2)"
pattern = '^inventory x86_64/portable/sha2_192s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 4

[[x86_64-portable-sha2-s.line]]
what = "files of sha2_256s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set x86_64/portable/sha2_256s: PASS (\d+) files$'
minimum = 38

[[x86_64-portable-sha2-s.line]]
what = "theorems in the unchanged inventory of x86_64/portable/sha2_256s (Encoding 2, ADRSc 2)"
pattern = '^inventory x86_64/portable/sha2_256s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 4

[[x86_64-portable-sha2-s.line]]
what = "sets of the sha2-s group checked against the x86_64/portable models"
pattern = '^check-sets x86_64-portable-sha2-s: PASS (\d+) sets$'
minimum = 3
