#
# ci/rules/proofs-aarch64-a64scalar-shake-s.toml: the shake-s sets against the aarch64/a64scalar
# models: the per-set proofs and inventories
# (ci/counts.py). A minimum is the count of the complete run on the
# current tree; lowering one is a reviewed change.

[aarch64-a64scalar-shake-s]
[[aarch64-a64scalar-shake-s.line]]
what = "files of shake_128s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set aarch64/a64scalar/shake_128s: PASS (\d+) files$'
minimum = 35

[[aarch64-a64scalar-shake-s.line]]
what = "theorems in the unchanged inventory of aarch64/a64scalar/shake_128s (Encoding 2, DigestIndices 2, Wots 1, Thash 3)"
pattern = '^inventory aarch64/a64scalar/shake_128s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 8

[[aarch64-a64scalar-shake-s.line]]
what = "files of shake_192s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set aarch64/a64scalar/shake_192s: PASS (\d+) files$'
minimum = 38

[[aarch64-a64scalar-shake-s.line]]
what = "theorems in the unchanged inventory of aarch64/a64scalar/shake_192s (Encoding 2, DigestIndices 2, Wots 1, Thash 3)"
pattern = '^inventory aarch64/a64scalar/shake_192s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 8

[[aarch64-a64scalar-shake-s.line]]
what = "files of shake_256s: the model, SetModel, its array theories and the per-set proofs, every file checked"
pattern = '^check-set aarch64/a64scalar/shake_256s: PASS (\d+) files$'
minimum = 34

[[aarch64-a64scalar-shake-s.line]]
what = "theorems in the unchanged inventory of aarch64/a64scalar/shake_256s (Encoding 2, DigestIndices 2, Wots 1, Thash 3)"
pattern = '^inventory aarch64/a64scalar/shake_256s: \d+ axioms, (\d+) theorems, \d+ definitions, unchanged$'
minimum = 8

[[aarch64-a64scalar-shake-s.line]]
what = "sets of the shake-s group checked against the aarch64/a64scalar models"
pattern = '^check-sets aarch64-a64scalar-shake-s: PASS (\d+) sets$'
minimum = 3
