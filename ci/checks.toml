#
# ci/checks.toml
# ==============
#
# The registry of the continuous integration: the platforms, the components
# of the repository, and every check with the files it reads. The scripts
# beside this file read it (ci/README.md); nothing else defines a
# check.
#
# A check reads every tracked file except those its entry and [inputs]
# skip-all leave out (by path: a name and everything under it), so a file
# added at a path nobody listed is an input of every check. Three
# exceptions are fixed in ci/key.py, not here: every *.mk file one or
# two directories down outside ci/ stays an input of each check that reads
# the top-level Makefile (does not skip it), because that Makefile
# includes them; a check reads its own recipe ci/checks/<recipe>.mk
# and its own rules ci/rules/<check>.toml, and not those of other
# checks; and the files under toolchain/ enter through the toolchain
# identity instead.
#
# This file is not an input as a whole: each check's key covers what the
# file says about that check (its own table, its platform's, skip-all and
# the components it depends on; ci/key.py), so a comment or another
# check's entry leaves its key unchanged. An input list is where a wrong
# exclusion would hide a stale pass.

format = 2

# ---------------------------------------------------------------------------
# Platforms: hosted runner label, the target directory of the top-level
# Makefile (build/<target>/), the options of toolchain/build.sh, and the
# parallel jobs of a build or a check.

[platforms.linux-x86_64]
runner = "ubuntu-24.04"
system = "Linux"
machine = "x86_64"
arch = "x86_64"
target = "x86_64-elf"
toolchain-options = ""
jobs = 4

[platforms.linux-aarch64]
runner = "ubuntu-24.04-arm"
system = "Linux"
machine = "aarch64"
arch = "aarch64"
target = "aarch64-elf"
# The pinned SMT provers have no Linux AArch64 binaries: the compiler alone.
toolchain-options = "--no-easycrypt"
jobs = 4

[platforms.macos-aarch64]
runner = "macos-26"
system = "Darwin"
machine = "arm64"
arch = "aarch64"
target = "aarch64-macho"
toolchain-options = ""
# Three cores and 7 GB of memory: two jobs leave a margin for memory.
jobs = 2

# ---------------------------------------------------------------------------
# Components. A component is present when any of its directories exists. A
# check of an absent component reports NOT APPLICABLE, unless the component
# is required: a required component that is absent fails every run, so
# deleting one cannot turn its checks into NOT APPLICABLE. Every directory
# at the root is a component directory, a container of component
# directories, or a root that holds no component; every directory directly
# inside a container is a component directory. Any other directory fails
# the source check, so a component at a path this table does not know
# cannot pass as absent.

[components]
required = ["hash", "slhdsa", "asm", "proofs", "core", "acvp", "diff"]
containers = ["src", "tests", "analysis", "third_party"]
other-roots = [".git", ".github", "LICENSES", "changes", "ci", "docs", "toolchain", "build"]

[components.dirs]
hash = ["src/hash", "tests/hash"]
slhdsa = ["src/slhdsa", "analysis/ct"]
core = ["include", "capi", "tests/core", "tests/negative", "tests/abi"]
acvp = ["tests/acvp", "tests/vectors"]
diff = ["tests/diff"]
safety = ["analysis/safety"]
asm = ["analysis/asm"]
proofs = ["proofs", "third_party/crypto-specs", "third_party/formosa-slhdsa"]
gen = ["gen"]
bench = ["bench"]

# ---------------------------------------------------------------------------
# Inputs. skip-all: what no check reads. Documentation, change entries,
# licensing and repository metadata, the workflows and scripts that run no
# check of ci.yml (changelog, retry, drift, lint, the source checks, the
# status record, the gates, which judge results but produce none) and the
# tests of the CI scripts. Files are named one by one, never by extension:
# Jasmin `require`, C `#include` and make `include` read a file of any name.

[inputs]
skip-all = [
  "docs", "changes", "LICENSES",
  "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md",
  "AUTHORS", "NOTICE", "LICENSE", "CITATION.cff", "REUSE.toml",
  "analysis/README.md", "proofs/README.md", "src/hash/README.md", "tests/hash/README.md",
  ".github/CODEOWNERS", ".github/ISSUE_TEMPLATE", ".github/pull_request_template.md",
  ".github/dependabot.yml", ".github/zizmor.yml",
  ".github/workflows/changelog.yml", ".github/workflows/ci-retry.yml",
  ".github/workflows/drift.yml",
  "ci/changes.sh",
  "ci/README.md", "ci/changelog.py", "ci/drift.py", "ci/lint.py",
  "ci/policy.py", "ci/retry.py", "ci/source.py", "ci/kernel_roots.py", "ci/gate.py",
  "ci/status.py", "ci/version.py",
  "ci/tests",
]

# ---------------------------------------------------------------------------
# Checks. For each:
#
#   recipe      ci/checks/<recipe>.mk, target ci-<recipe>
#   shard       a parameter of the recipe (proof shards)
#   component   NOT APPLICABLE while it is absent (see [components])
#   needs       components that must be present when this one is: an
#               error otherwise
#   absent      the status when the component is absent: NOT APPLICABLE
#               (default), or NOT RUN with `not-run-when`, components whose
#               presence makes the absence a gap rather than nothing to do
#   platforms   where it runs, natively
#   toolchain   none, compiler (jasminc, jasmin-ct, jasmin2ec) or switch
#               (the opam switch too: EasyCrypt, the provers, the
#               analysers' libraries)
#   opam        run inside the switch's environment (toolchain.sh exec)
#   keep        files of the run a later job reads, as recorded
#   skip        paths the check provably does not read
#   reads       paths of skip-all the check reads all the same: inputs of
#               this check alone
#
# The top-level Makefile (and with it the fragments it includes) is
# skipped by the checks whose recipe runs make only with -C in a directory
# whose own Makefile includes nothing and calls make only on itself:
# tests/hash for the hash checks, proofs for the shards. Every other recipe
# runs the top-level Makefile. ci/tests/test_key.py checks both halves.

[checks.test-hash]
recipe = "test-hash"
component = "hash"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64"]
toolchain = "compiler"
# The hash tests build src/hash with tests/hash and read nothing else.
skip = ["Makefile", "src/slhdsa", "capi", "include", "tests/core", "tests/negative", "tests/abi",
        "tests/acvp", "tests/diff", "tests/vectors", "bench", "analysis", "proofs", "third_party"]

[checks.analysis-hash]
recipe = "analysis-hash"
component = "hash"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64"]
toolchain = "compiler"
# jasmin-ct and --sct on the hash test exports: src/hash and tests/hash.
skip = ["Makefile", "src/slhdsa", "capi", "include", "tests/core", "tests/negative", "tests/abi",
        "tests/acvp", "tests/diff", "tests/vectors", "bench", "analysis", "proofs", "third_party"]

[checks.test-core]
recipe = "test-core"
component = "core"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64"]
toolchain = "compiler"
keep = ["build/ci/transcript-{target}.txt"]
# make check: the library (src, capi, include) and tests/{core,negative,abi},
# and the C example of README.md, which it builds and runs.
reads = ["README.md"]
skip = ["tests/hash", "tests/acvp", "tests/diff", "tests/vectors", "bench", "analysis",
        "proofs", "third_party", "ci/hash-sets.toml"]

# make memcheck: the programs of make check that call the library, under
# Valgrind's memcheck, with its negative control (tests/core/memcheck.py).
# Linux only: Valgrind has no port to macOS on AArch64. It builds what make
# check builds, the README's example included.
[checks.memcheck]
recipe = "memcheck"
component = "core"
platforms = ["linux-x86_64", "linux-aarch64"]
toolchain = "compiler"
reads = ["README.md"]
skip = ["tests/hash", "tests/acvp", "tests/diff", "tests/vectors", "bench",
        "analysis", "proofs", "third_party", "ci/hash-sets.toml"]

# The runner and its controls (tests/acvp), the vector pins (tests/vectors),
# the adapters it links (tests/diff/adapters) and the library.
[checks.test-acvp]
recipe = "test-acvp"
component = "acvp"
needs = ["core", "diff"]
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64"]
toolchain = "compiler"
skip = ["tests/hash", "bench", "analysis", "proofs", "third_party", "ci/hash-sets.toml"]

[checks.analysis-units]
recipe = "analysis-units"
component = "slhdsa"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64"]
toolchain = "compiler"
# make ct: the Jasmin units of src with analysis/ct/ct.mk.
skip = ["capi", "include", "tests", "bench", "analysis/asm", "proofs", "third_party",
        "ci/hash-sets.toml"]

[checks.asm-policy]
recipe = "asm-policy"
component = "asm"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64"]
toolchain = "compiler"
# make asm-policy: the assembly of the units of src, the rules of analysis/asm.
skip = ["capi", "include", "tests", "bench", "analysis/ct", "proofs", "third_party",
        "ci/hash-sets.toml"]

# The driver, oracle and adapters (tests/diff), the baseline pins and their
# fetch (bench/baselines.*) and the library.
[checks.differential]
recipe = "differential"
component = "diff"
needs = ["core"]
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64"]
toolchain = "compiler"
skip = ["tests/hash", "tests/acvp", "tests/vectors", "analysis", "proofs", "third_party",
        "ci/hash-sets.toml"]

# gen-check, then `make check` from gen/ without the compiler: the inputs
# of test-core.
[checks.generated]
recipe = "generated"
component = "gen"
platforms = ["linux-x86_64", "linux-aarch64", "macos-aarch64"]
toolchain = "compiler"
reads = ["README.md"]
skip = ["tests/hash", "tests/acvp", "tests/diff", "tests/vectors",
        "bench", "analysis", "proofs", "third_party", "ci/hash-sets.toml"]

# jasmin-checksafety. Until the safety component lands, the Jasmin code has
# no safety verdict and the constant-time results are conditional on one:
# NOT RUN, not NOT APPLICABLE.
[checks.safety]
recipe = "safety"
component = "safety"
absent = "NOT RUN"
not-run-when = ["hash", "slhdsa"]
platforms = ["linux-x86_64"]
toolchain = "switch"
skip = ["capi", "include", "tests/core", "tests/negative", "tests/abi", "tests/acvp", "tests/diff",
        "tests/vectors", "bench", "proofs", "third_party", "ci/hash-sets.toml"]

# Proof shards, all on linux-x86_64 (the pinned provers), each checking its
# files in parallel (proofs/Makefile, check-shard). A shard can load only
# the theories under its own load path, which is why the rest of proofs/
# and third_party/ can be left out of its inputs.
[checks.proofs-sphincs]
recipe = "proofs"
shard = "sphincs"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis",
        "third_party/crypto-specs", "proofs/spec", "proofs/security", "proofs/correctness",
        "proofs/extracted", "proofs/inventory", "ci/hash-sets.toml"]

[checks.proofs-crypto-specs]
recipe = "proofs"
shard = "crypto-specs"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis",
        "third_party/formosa-slhdsa", "proofs/spec", "proofs/security", "proofs/correctness",
        "proofs/extracted", "proofs/inventory", "ci/hash-sets.toml"]

[checks.proofs-spec]
recipe = "proofs"
shard = "spec"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "proofs/correctness",
        "proofs/extracted", "proofs/inventory", "ci/hash-sets.toml"]

# A pair shard checks the correctness proofs against one pair's extracted
# models (check-pair). It reads neither the per-set models and proofs nor
# the inventories, nor the models and instruction facts of other pairs.
[checks.proofs-x86_64-portable]
recipe = "proofs"
shard = "x86_64-portable"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/inventory", "proofs/correctness/core", "proofs/extracted/x86_64/portable/sets",
        "proofs/extracted/aarch64", "proofs/correctness/hash/aarch64"]

[checks.proofs-aarch64-portable]
recipe = "proofs"
shard = "aarch64-portable"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/inventory", "proofs/correctness/core", "proofs/extracted/x86_64",
        "proofs/extracted/aarch64/a64scalar", "proofs/correctness/hash/x86_64",
        "proofs/correctness/hash/aarch64/a64scalar"]

[checks.proofs-aarch64-a64scalar]
recipe = "proofs"
shard = "aarch64-a64scalar"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/inventory", "proofs/correctness/core",
        "proofs/extracted/aarch64/a64scalar/sets", "proofs/extracted/x86_64",
        "proofs/extracted/aarch64/portable", "proofs/correctness/hash/x86_64"]

# The inventory of every pair (inventory-pair), which loads every theory
# the pair is checked with: no per-set model or proof.
[checks.proofs-inventory]
recipe = "proofs"
shard = "inventory"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/correctness/core", "proofs/inventory/sets",
        "proofs/extracted/x86_64/portable/sets", "proofs/extracted/aarch64/a64scalar/sets"]

# A group shard checks the per-set proofs of its hash family against the
# models of the sets of its group (check-set), with their inventories. A
# set's load path holds its pair's directories too, so it reads them; it
# does not read other pairs, the other family's proofs or the pairs'
# inventories.
[checks.proofs-x86_64-portable-sha2-s]
recipe = "proofs"
shard = "x86_64-portable-sha2-s"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/extracted/aarch64", "proofs/correctness/hash/aarch64",
        "proofs/correctness/core/shake", "proofs/inventory/x86_64-portable.txt",
        "proofs/inventory/aarch64-portable.txt", "proofs/inventory/aarch64-a64scalar.txt"]

[checks.proofs-x86_64-portable-sha2-f]
recipe = "proofs"
shard = "x86_64-portable-sha2-f"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/extracted/aarch64", "proofs/correctness/hash/aarch64",
        "proofs/correctness/core/shake", "proofs/inventory/x86_64-portable.txt",
        "proofs/inventory/aarch64-portable.txt", "proofs/inventory/aarch64-a64scalar.txt"]

[checks.proofs-x86_64-portable-shake-s]
recipe = "proofs"
shard = "x86_64-portable-shake-s"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/extracted/aarch64", "proofs/correctness/hash/aarch64",
        "proofs/correctness/core/sha2", "proofs/inventory/x86_64-portable.txt",
        "proofs/inventory/aarch64-portable.txt", "proofs/inventory/aarch64-a64scalar.txt"]

[checks.proofs-x86_64-portable-shake-f]
recipe = "proofs"
shard = "x86_64-portable-shake-f"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/extracted/aarch64", "proofs/correctness/hash/aarch64",
        "proofs/correctness/core/sha2", "proofs/inventory/x86_64-portable.txt",
        "proofs/inventory/aarch64-portable.txt", "proofs/inventory/aarch64-a64scalar.txt"]

[checks.proofs-aarch64-a64scalar-sha2-s]
recipe = "proofs"
shard = "aarch64-a64scalar-sha2-s"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/extracted/x86_64", "proofs/extracted/aarch64/portable",
        "proofs/correctness/hash/x86_64",
        "proofs/correctness/core/shake", "proofs/inventory/x86_64-portable.txt",
        "proofs/inventory/aarch64-portable.txt", "proofs/inventory/aarch64-a64scalar.txt"]

[checks.proofs-aarch64-a64scalar-sha2-f]
recipe = "proofs"
shard = "aarch64-a64scalar-sha2-f"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/extracted/x86_64", "proofs/extracted/aarch64/portable",
        "proofs/correctness/hash/x86_64",
        "proofs/correctness/core/shake", "proofs/inventory/x86_64-portable.txt",
        "proofs/inventory/aarch64-portable.txt", "proofs/inventory/aarch64-a64scalar.txt"]

[checks.proofs-aarch64-a64scalar-shake-s]
recipe = "proofs"
shard = "aarch64-a64scalar-shake-s"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/extracted/x86_64", "proofs/extracted/aarch64/portable",
        "proofs/correctness/hash/x86_64",
        "proofs/correctness/core/sha2", "proofs/inventory/x86_64-portable.txt",
        "proofs/inventory/aarch64-portable.txt", "proofs/inventory/aarch64-a64scalar.txt"]

[checks.proofs-aarch64-a64scalar-shake-f]
recipe = "proofs"
shard = "aarch64-a64scalar-shake-f"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "switch"
opam = true
jobs = 3
skip = ["Makefile", "src", "capi", "include", "tests", "bench", "analysis", "ci/hash-sets.toml",
        "proofs/extracted/x86_64", "proofs/extracted/aarch64/portable",
        "proofs/correctness/hash/x86_64",
        "proofs/correctness/core/sha2", "proofs/inventory/x86_64-portable.txt",
        "proofs/inventory/aarch64-portable.txt", "proofs/inventory/aarch64-a64scalar.txt"]

# The committed models against a fresh extraction of the Jasmin sources
# proofs/tools/extract.sh reads: the hash layer and the SLH-DSA core
# (src/hash, src/slhdsa, through extracted/*.jazz).
[checks.proofs-extraction]
recipe = "proofs"
shard = "extraction"
component = "proofs"
platforms = ["linux-x86_64"]
toolchain = "compiler"
skip = ["Makefile", "capi", "include", "tests", "bench", "analysis", "third_party",
        "proofs/spec", "proofs/security", "proofs/correctness", "proofs/inventory",
        "ci/hash-sets.toml"]

# The platforms against each other: the same extracted compiler and
# assumptions, the same core transcripts. Its inputs are the keys of the
# test-core legs and the toolchain identity (ci/key.py).
[agree]
component = "core"
over = "test-core"
