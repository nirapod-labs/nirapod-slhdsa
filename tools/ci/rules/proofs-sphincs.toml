#
# tools/ci/rules/proofs-sphincs.toml: files the proof shard sphincs checks
# (tools/ci/counts.py). A minimum is the count of the complete run on the
# current tree; lowering one is a reviewed change.

[sphincs]
[[sphincs.line]]
what = "the imported SPHINCS+ proof, every file checked"
pattern = '^shard sphincs: PASS (\d+) files$'
minimum = 11
