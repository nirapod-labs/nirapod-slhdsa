# docs/status.toml
# ================
#
# The single record of what has been checked and proven. ci/status.py
# renders it into the marked sections of README.md and docs/STATUS.md, and
# `python3 -I ci/status.py check` (run by ci/source.py) fails when a
# rendered section differs from this file. Edit this file, then run
# `python3 -I ci/status.py write`; never edit a rendered section by hand.
#
# Words: an evidence label (PROVEN, VERIFIED, MEASURED, STRONGLY SUPPORTED,
# INFERRED, UNKNOWN) says what kind of evidence supports a claim; a check
# status (PASS, FAIL, INCONCLUSIVE, NOT RUN, NOT APPLICABLE) says how a
# check ended. They are kept apart, and the script rejects any other word in
# those fields. Links are written from the repository root.

format = 1

# The parameter sets of FIPS 205 Table 2, in the order the tables list them.
sets = [
  "SLH-DSA-SHA2-128s", "SLH-DSA-SHA2-128f",
  "SLH-DSA-SHA2-192s", "SLH-DSA-SHA2-192f",
  "SLH-DSA-SHA2-256s", "SLH-DSA-SHA2-256f",
  "SLH-DSA-SHAKE-128s", "SLH-DSA-SHAKE-128f",
  "SLH-DSA-SHAKE-192s", "SLH-DSA-SHAKE-192f",
  "SLH-DSA-SHAKE-256s", "SLH-DSA-SHAKE-256f",
]

# The CI run on main that every PASS below comes from, unless a row names
# another one (a [[table]] may carry its own revision and run).
[evidence]
revision = "de27e6a"
run = "38680243373"
date = "2026-10-15"


# ---------------------------------------------------------------------------
# The summary in README.md: one row per claim, short scope, one link to the
# page that states the claim in full. A row whose result comes from another
# run names it with revision and run.

[[summary]]
claim = "Conformance to FIPS 205"
link = "docs/VALIDATION.md"
evidence = "VERIFIED"
check = "PASS"
scope = "ACVP vectors and a differential test, 12 sets, every interface, 3 platforms"

[[summary]]
claim = "Constant time and speculative constant time"
link = "docs/SECURITY-MODEL.md"
evidence = "VERIFIED"
check = "PASS"
scope = "every Jasmin unit, both architectures; conditional on memory safety"

[[summary]]
claim = "Memory safety of the Jasmin code"
link = "docs/SECURITY-MODEL.md#memory-safety"
evidence = "UNKNOWN"
check = "NOT RUN"
scope = "the checker reaches no verdict on these exports yet"

[[summary]]
claim = "EUF-CMA security of the specification"
link = "docs/PROOFS.md#security-of-the-specification"
evidence = "PROVEN"
check = "PASS"
scope = "the EasyCrypt specification, 12 sets; not the Jasmin code"

[[summary]]
claim = "The code implements the specification"
link = "docs/PROOFS.md#the-code-against-the-specification"
evidence = "UNKNOWN"
scope = "open; proven: SHA-2 compression, scalar Keccak-f[1600], address setters"

[[summary]]
claim = "The compiler preserves program semantics"
link = "docs/TOOLCHAIN.md#assurance-boundary-of-the-toolchain"
evidence = "PROVEN"
check = "PASS"
# The toolchain build that re-checked the compiler proofs; toolchain/ is
# unchanged since, and later runs reuse that build by key.
revision = "8646299"
run = "38554446843"
scope = "source to assembly syntax, in Rocq; printer, assembler, linker trusted"

